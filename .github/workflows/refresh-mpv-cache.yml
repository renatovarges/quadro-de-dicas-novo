name: Atualizar cache MPV

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  refresh-mpv-cache:
    name: Renovar token e salvar MPV
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r nova_plataforma_tcc/requirements.txt

      - name: Atualizar cache MPV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_ENCRYPTION_KEY: ${{ secrets.AUTH_ENCRYPTION_KEY }}
          GLOBO_ACCESS_TOKEN: ${{ secrets.GLOBO_ACCESS_TOKEN }}
          GLOBO_ID_TOKEN: ${{ secrets.GLOBO_ID_TOKEN }}
          GLOBO_REFRESH_TOKEN: ${{ secrets.GLOBO_REFRESH_TOKEN }}
        run: python nova_plataforma_tcc/tools/refresh_mpv_cache.py
